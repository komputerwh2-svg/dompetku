<div id="tabungan" class="space-y-5 w-full animate__animated animate__fadeIn">
    <!-- Panel Cards Grid -->
    <div class="grid grid-cols-2 gap-3.5 w-full">
        <!-- Panel Tabungan Utama -->
        <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-xs flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-2">
                    <div class="w-7 h-7 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xs">
                        <i class="fas fa-university"></i>
                    </div>
                    <span class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Tabungan Utama</span>
                </div>
                <h4 class="text-sm font-black text-gray-900" id="tabungan-utama-saldo">Rp 0</h4>
                <p class="text-[9px] text-gray-400 mt-0.5" id="tabungan-utama-target">Target: Rp 0</p>
            </div>
            
            <div class="space-y-1 mt-4">
                <div class="flex justify-between text-[10px] font-bold">
                    <span class="text-gray-400">Progres</span>
                    <span class="text-blue-600" id="tabungan-utama-persen">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                    <div id="tabungan-utama-bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Panel Tabungan Darurat -->
        <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-xs flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-2">
                    <div class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xs">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <span class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Dana Darurat</span>
                </div>
                <h4 class="text-sm font-black text-gray-900" id="tabungan-darurat-saldo">Rp 0</h4>
                <p class="text-[9px] text-gray-400 mt-0.5" id="tabungan-darurat-target">Target: Rp 0</p>
            </div>
            
            <div class="space-y-1 mt-4">
                <div class="flex justify-between text-[10px] font-bold">
                    <span class="text-gray-400">Progres</span>
                    <span class="text-rose-600" id="tabungan-darurat-persen">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                    <div id="tabungan-darurat-bar" class="bg-rose-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Mutasi -->
    <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-xs w-full">
        <div class="flex items-center justify-between mb-3.5 px-0.5">
            <h3 class="text-xs font-black text-gray-800 uppercase tracking-wider">Riwayat Tabungan & Mutasi</h3>
            <i class="fas fa-exchange-alt text-gray-400 text-xs"></i>
        </div>
        <div id="container-riwayat-mutasi-tabungan" class="space-y-4">
            <div class="flex flex-col items-center justify-center py-8 text-center text-gray-400">
                <i class="fas fa-receipt text-xl mb-1.5 text-gray-300"></i>
                <p class="text-[10px] font-bold">Memuat data transaksi...</p>
            </div>
        </div>
    </div>
</div>
