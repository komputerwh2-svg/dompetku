<!-- views/servis.html -->
<div id="servis-view" class="w-full animate__animated animate__fadeIn space-y-6">
    
    <!-- Grid Panel Kendaraan (3 Kendaraan) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Kendaraan 1 -->
        <div onclick="if(typeof bukaModalFormServis === 'function') bukaModalFormServis(1)" 
             class="bg-white rounded-2xl p-4 shadow-xs border border-gray-200 relative cursor-pointer hover:border-blue-300 transition-all group">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-3">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i class="fas fa-motorcycle text-sm"></i>
                    </div>
                    <h3 id="servis-v1-nama-plat" class="font-bold text-gray-900 text-sm">Kendaraan 1</h3>
                </div>
                <button type="button" 
                        aria-label="Edit Kendaraan 1"
                        onclick="event.stopPropagation(); if(typeof bukaModalEditKendaraan === 'function') bukaModalEditKendaraan(1)" 
                        class="p-1.5 text-gray-400 hover:text-blue-600 rounded-lg focus:outline-none">
                    <i class="fas fa-pen text-xs"></i>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-xl">
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">SERVIS LALU</span>
                    <span id="servis-v1-tgl-lalu" class="font-medium text-gray-600">-</span>
                </div>
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">TERBARU</span>
                    <span id="servis-v1-tgl-baru" class="font-semibold text-blue-600">-</span>
                </div>
            </div>
        </div>

        <!-- Kendaraan 2 -->
        <div onclick="if(typeof bukaModalFormServis === 'function') bukaModalFormServis(2)" 
             class="bg-white rounded-2xl p-4 shadow-xs border border-gray-200 relative cursor-pointer hover:border-blue-300 transition-all group">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-3">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i class="fas fa-motorcycle text-sm"></i>
                    </div>
                    <h3 id="servis-v2-nama-plat" class="font-bold text-gray-900 text-sm">Kendaraan 2</h3>
                </div>
                <button type="button" 
                        aria-label="Edit Kendaraan 2"
                        onclick="event.stopPropagation(); if(typeof bukaModalEditKendaraan === 'function') bukaModalEditKendaraan(2)" 
                        class="p-1.5 text-gray-400 hover:text-blue-600 rounded-lg focus:outline-none">
                    <i class="fas fa-pen text-xs"></i>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-xl">
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">SERVIS LALU</span>
                    <span id="servis-v2-tgl-lalu" class="font-medium text-gray-600">-</span>
                </div>
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">TERBARU</span>
                    <span id="servis-v2-tgl-baru" class="font-semibold text-blue-600">-</span>
                </div>
            </div>
        </div>

        <!-- Kendaraan 3 -->
        <div onclick="if(typeof bukaModalFormServis === 'function') bukaModalFormServis(3)" 
             class="bg-white rounded-2xl p-4 shadow-xs border border-gray-200 relative cursor-pointer hover:border-blue-300 transition-all group">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-3">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i class="fas fa-motorcycle text-sm"></i>
                    </div>
                    <h3 id="servis-v3-nama-plat" class="font-bold text-gray-900 text-sm">Kendaraan 3</h3>
                </div>
                <button type="button" 
                        aria-label="Edit Kendaraan 3"
                        onclick="event.stopPropagation(); if(typeof bukaModalEditKendaraan === 'function') bukaModalEditKendaraan(3)" 
                        class="p-1.5 text-gray-400 hover:text-blue-600 rounded-lg focus:outline-none">
                    <i class="fas fa-pen text-xs"></i>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-xl">
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">SERVIS LALU</span>
                    <span id="servis-v3-tgl-lalu" class="font-medium text-gray-600">-</span>
                </div>
                <div>
                    <span class="text-gray-400 block text-[10px] font-semibold">TERBARU</span>
                    <span id="servis-v3-tgl-baru" class="font-semibold text-blue-600">-</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Riwayat Servis -->
    <div class="bg-white rounded-2xl p-5 shadow-xs border border-gray-200/80 w-full relative overflow-hidden min-h-[180px]">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wider">RIWAYAT SERVIS KENDARAAN</h3>
            <span class="text-xs text-gray-400 font-semibold" id="total-riwayat-servis">0 Transaksi</span>
        </div>
        
        <!-- Container Item Riwayat Servis (Diisi via JS) -->
        <div id="container-riwayat-servis" class="space-y-3">
            <div class="text-center py-8 text-gray-400 text-xs font-medium">
                <i class="fas fa-circle-notch fa-spin text-blue-500 mr-2"></i>Memuat riwayat servis...
            </div>
        </div>
    </div>

</div>
